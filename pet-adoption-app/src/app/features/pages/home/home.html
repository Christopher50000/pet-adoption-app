<section class="hero">
  <p class="quote">"Saving one pet won't change the world… but for that one pet, the world will change forever."</p>
</section>


<section class="pets-sample-section">
  @for (pet of pets; track pet.name) {
    <div class="pet-sample-card enter-animation">
      <img [src]="pet.image" [alt]="pet.name" />
      <h3>{{ pet.name }}</h3>
      <p>{{ pet.description }}</p>
    </div>
  } @empty {
    <p>No pets available at the moment.</p>
  }
</section>


<footer>
  <p>&copy; Pet Adoption Agency</p>
</footer>
